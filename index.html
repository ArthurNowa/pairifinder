<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16231b">
  <title>Pairi Hunt</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Retour">←</button>
      <div>
        <p class="eyebrow">Concours photo</p>
        <h1>Pairi Hunt</h1>
      </div>
      <button id="menuBtn" class="icon-btn" aria-label="Menu">⋮</button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav id="bottomNav" class="bottom-nav hidden" aria-label="Navigation principale">
      <button data-route="hunt">Ma chasse</button>
      <button data-route="guesses">Prédictions</button>
      <button data-route="results">Score</button>
    </nav>
  </div>

  <dialog id="menuDialog" class="sheet">
    <div class="sheet-head">
      <strong>Partie</strong>
      <button class="icon-btn" data-close-dialog aria-label="Fermer">×</button>
    </div>
    <button id="exportBtn" class="menu-action">💾 Exporter la sauvegarde</button>
    <label class="menu-action file-action">📂 Importer une sauvegarde<input id="importInput" type="file" accept="application/json,.json"></label>
    <button id="resetBtn" class="menu-action danger">↺ Réinitialiser la partie</button>
  </dialog>

  <dialog id="animalDialog" class="sheet animal-sheet">
    <div id="animalDialogContent"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
